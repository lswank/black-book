name: Bug report
description: Something in the plugin doesn't work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What you tried
      description: Specialist or command name, the input you gave, and what you expected.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The actual behavior. Include the relevant chat output if useful.
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      placeholder: "(run /version)"
  - type: textarea
    id: extra
    attributes:
      label: Anything else
